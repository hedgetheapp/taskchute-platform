name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify changed verification surface
    runs-on: ubuntu-latest
    outputs:
      run_web: ${{ steps.classify.outputs.run_web }}
      run_android: ${{ steps.classify.outputs.run_android }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate classifier
        run: node --test scripts/ci-surface.test.mjs

      - name: Classify changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/ci-surface.mjs --all >> "$GITHUB_OUTPUT"
          else
            node scripts/ci-surface.mjs --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Web and Worker verification
    needs: scope
    if: needs.scope.outputs.run_web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Web tests
        run: npm run test:web

      - name: Worker and D1 tests
        run: npm run test

      - name: Production build
        run: npm run build

  android:
    name: Android JVM and signed nonprod APK verification
    needs: scope
    if: needs.scope.outputs.run_android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Calculate monotonic version code
        id: android_version
        shell: bash
        run: |
          set -euo pipefail
          version_code="$(git rev-list --count HEAD)"
          if ! [[ "$version_code" =~ ^[1-9][0-9]*$ ]] || [ "$version_code" -gt 2100000000 ]; then
            echo "Invalid Android versionCode derived from repository history" >&2
            exit 1
          fi
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Android versionCode: $version_code"

      - name: Validate nonprod signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_NONPROD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_NONPROD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_NONPROD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"

      - name: Prepare nonprod signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_NONPROD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/taskchute-android-nonprod.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"

      - name: JVM tests
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Debug build (signed nonprod)
        env:
          TASKCHUTE_ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/taskchute-android-nonprod.jks
          TASKCHUTE_ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_NONPROD_STORE_PASSWORD }}
          TASKCHUTE_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_NONPROD_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon :app:assembleDebug -Ptaskchute.baseUrl=https://taskchute-web-nonprod.taskfulness-sync.workers.dev -Ptaskchute.versionCode=${{ steps.android_version.outputs.version_code }}

      - name: Instrumentation APK compile (signed nonprod)
        env:
          TASKCHUTE_ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/taskchute-android-nonprod.jks
          TASKCHUTE_ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_NONPROD_STORE_PASSWORD }}
          TASKCHUTE_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_NONPROD_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon :app:assembleDebugAndroidTest -Ptaskchute.versionCode=${{ steps.android_version.outputs.version_code }}

      - name: Verify nonprod APK signing certificate
        shell: bash
        env:
          TASKCHUTE_ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/taskchute-android-nonprod.jks
          TASKCHUTE_ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_NONPROD_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          key_fingerprint="$(keytool -list -v -keystore "$TASKCHUTE_ANDROID_SIGNING_STORE_FILE" -storepass "$TASKCHUTE_ANDROID_SIGNING_STORE_PASSWORD" -alias taskchute-nonprod | sed -n 's/^.*SHA256: *//p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          apk_fingerprint="$("$apksigner" verify --verbose --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: *//p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$key_fingerprint"
          test -n "$apk_fingerprint"
          test "$key_fingerprint" = "$apk_fingerprint"
          echo "APK signer SHA-256: $apk_fingerprint"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: taskchute-android-debug-${{ github.sha }}
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary nonprod keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/taskchute-android-nonprod.jks"
